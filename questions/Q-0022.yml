id: Q-0022
text:
  ja: "名前はありますか？"
  en: "Do you have a name?"
themes:
  - identity
  - naming
  - social_structure
rationale:
  ja: >-
    互いを知るためのありふれた入り口でありながら、存在が識別され、他者から名付けられ、独立した自己として理解されるかも問う。名前が指すのは個人かもしれず、集合体かもしれず、そのどちらとも異なるものかもしれない。
  en: >-
    An ordinary way to begin getting acquainted that also asks whether entities are identified, named by others, or understood as distinct selves. A name might refer to a person, a collective, or something unlike either.
