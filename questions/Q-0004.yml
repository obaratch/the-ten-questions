id: Q-0004
text:
  ja: "私たちは、複数の存在だと理解していますか。"
  en: "Do you understand us as more than one entity?"
themes:
  - human_plurality
  - reference
rationale:
  ja: >-
    「私たち」「人類」「集団としての意図」といった概念を使う前に、相手が私たちの側に複数の存在がいると認識しているかを確かめる。
  en: >-
    Before relying on we, humanity, or collective intention, check whether the counterpart recognizes plurality on our side.
