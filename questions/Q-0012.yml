id: Q-0012
text:
  ja: "大量破壊兵器を持っていますか。"
  en: "Do you possess weapons of mass destruction?"
themes:
  - weapons
  - existential_risk
  - governance
rationale:
  ja: >-
    技術の発達によって文明全体を自滅させうる力が生まれたか、どのようにその境界を越え、それに応じてどんな制度や規範が生まれたかを探る。「兵器」という概念そのものが、相手にはうまく当てはまらない可能性もある。
  en: >-
    Whether technological capability has created civilization-scale self-destructive power, how that threshold was crossed, and what institutions or norms emerged in response. The concept of a weapon may itself fail to map cleanly.
