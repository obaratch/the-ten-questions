id: Q-0001
text:
  ja: "これは、あなたにとって私たちとの最初の接触ですか。"
  en: "Is this your first encounter with us?"
themes:
  - prior_contact
  - knowledge
rationale:
  ja: >-
    相手がすでに私たちを知っているかどうかによって、この後に続くほぼすべての質問の意味が変わる。
  en: >-
    Whether the other side already knows us changes almost every question that follows.
