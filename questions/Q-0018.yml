id: Q-0018
text:
  ja: "この接触以前から、私たちのことを知っていましたか。"
  en: "Did you know about us before this encounter?"
themes:
  - prior_knowledge
  - observation
rationale:
  ja: >-
    直接の接触が初めてであることと、それ以前に観察したり知識を持っていたりすることを区別する。
  en: >-
    Distinguish prior observation or knowledge from first direct contact.
