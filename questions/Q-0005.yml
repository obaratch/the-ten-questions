id: Q-0005
text:
  ja: "あなたは、他の存在を代表して話していますか。"
  en: "Are you communicating on behalf of others?"
themes:
  - representation
  - collective
rationale:
  ja: >-
    対話している存在と、その背後にある共同体、ネットワーク、組織、集合体は、同じものとは限らない。
  en: >-
    The communicating entity and the community, network, institution, or collective behind it may not be the same thing.
