id: Q-0006
text:
  ja: "私たちに出会って、驚きましたか？"
  en: "Were you surprised to meet us?"
themes:
  - intention
  - encounter
  - surprise
rationale:
  en: >-
    Distinguish deliberate contact from accident, discovery, interception, observation, or coincidence without assuming which side travelled. The encounter might have been unexpected for both sides.
