id: Q-0009
text:
  ja: "あなたは以前に、自分とは異なる知的存在と接触したことがありますか。"
  en: "Have you previously encountered an intelligence unlike yourselves?"
themes:
  - other_intelligence
  - prior_contact
rationale:
  ja: >-
    初めての接触なのは私たちの側だけなのか、相手はすでに別の形の知性を知っているのかが分かるかもしれない。
  en: >-
    This may reveal whether first contact is new only to us, and whether other forms of intelligence are already known to the counterpart.
