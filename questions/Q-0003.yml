id: Q-0003
text:
  ja: "あなたと同じような存在は、他にもいますか。"
  en: "Are there others like you?"
themes:
  - peers
  - plurality
  - kind
rationale:
  ja: >-
    相手の側に、仲間、同類、集団、種、文明に似たものが存在するかどうかを探る入り口となる。
  en: >-
    This begins to test whether anything resembling peers, a kind, a population, a species, or a civilization exists on the other side.
