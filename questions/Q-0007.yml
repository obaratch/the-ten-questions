id: Q-0007
text:
  ja: "あなたは、出来事に前と後があると認識しますか。"
  en: "Do you distinguish before from after?"
themes:
  - time
  - sequence
rationale:
  ja: >-
    歴史、予測、待つこと、順序といった馴染みのある概念を使う前に、出来事に順序があるという考えを共有できるか確かめる。
  en: >-
    Establish whether ordered events are a shared concept before relying on familiar notions of history, prediction, waiting, or sequence.
