id: Q-0025
text:
  ja: "退屈することはありますか？"
  en: "Do you ever get bored?"
themes:
  - boredom
  - motivation
  - experience
rationale:
  ja: >-
    刺激や意味のある活動がない状態を知性が経験するか、そして自分の状態に満足できなくなったときにどう応じるかを探る。
  en: >-
    Whether an intelligence can experience an absence of stimulation or meaningful activity, and how it responds when its own state becomes unsatisfying.
