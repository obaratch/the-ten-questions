name: Question data validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate question data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run validator tests
        run: npm test
      - name: Check merge readiness
        shell: bash
        run: |
          set +e
          output=$(npm run --silent validate:merge 2>&1)
          status=$?
          printf '%s\n' "$output"

          {
            echo "## Question data validation"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Question data is ready to merge."
            else
              echo "The pull request is not ready to merge yet."
              echo
              echo '```text'
              printf '%s\n' "$output"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
      - name: Build publishable data
        run: npm run build
      - name: Upload publishable data
        uses: actions/upload-artifact@v4
        with:
          name: publishable-data
          path: dist/
          retention-days: 7
      - name: Build static site
        run: npm run build:site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
