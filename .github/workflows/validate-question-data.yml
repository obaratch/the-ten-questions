name: Question data validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate question data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run validator tests
        run: npm test
      - name: Check merge readiness
        shell: bash
        run: |
          set +e
          output=$(npm run --silent validate:merge 2>&1)
          status=$?
          printf '%s\n' "$output"

          {
            echo "## Question data validation"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Question data is ready to merge."
            else
              echo "The pull request is not ready to merge yet."
              echo
              echo '```text'
              printf '%s\n' "$output"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
