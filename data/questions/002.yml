id: "002"
text:
  ja: "あなたは、一つの存在ですか。"
  en: "Are you one entity?"
themes:
  - self
  - individuality
  - plurality
rationale:
  en: >-
    Do not assume an individual speaker. The counterpart might be collective, distributed, planetary, artificial, or something for which our singular/plural distinction fits poorly.
