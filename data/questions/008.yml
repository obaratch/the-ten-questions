id: "008"
text:
  ja: "あなたは、ある出来事が別の出来事を引き起こすと認識しますか。"
  en: "Do you recognize that one event can cause another?"
themes:
  - causality
rationale:
  en: >-
    Temporal order and causality are not the same. Shared causal reasoning matters for explanation, prediction, responsibility, and agreements.
