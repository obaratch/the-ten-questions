id: "020"
text:
  ja: "私たちをどのような存在だと理解していますか。"
  en: "How do you understand us?"
themes:
  - perspective
  - interpretation
  - reciprocity
rationale:
  en: >-
    Learn how we appear from the other side. This may expose assumptions in our own self-description, but it is difficult to fit into a yes/no bootstrap.
