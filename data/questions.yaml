questions:
  - id: Q01
    priority: 1
    themes: [prior_contact, knowledge]
    text:
      ja: "これは、あなたにとって私たちとの最初の接触ですか。"
      en: "Is this your first encounter with us?"
  - id: Q02
    priority: 2
    themes: [self, individuality, plurality]
    text:
      ja: "あなたは、一つの存在ですか。"
      en: "Are you one entity?"
  - id: Q03
    priority: 3
    themes: [peers, plurality, kind]
    text:
      ja: "あなたと同じような存在は、他にもいますか。"
      en: "Are there others like you?"
  - id: Q04
    priority: 4
    themes: [human_plurality, reference]
    text:
      ja: "私たちは、複数の存在だと理解していますか。"
      en: "Do you understand us as more than one entity?"
  - id: Q05
    priority: 5
    themes: [representation, collective]
    text:
      ja: "あなたは、他の存在を代表して話していますか。"
      en: "Are you communicating on behalf of others?"
  - id: Q06
    priority: 6
    themes: [intention, encounter]
    text:
      ja: "この接触は、あなたの側で意図されたものですか。"
      en: "Was this encounter intentional on your side?"
  - id: Q07
    priority: 7
    themes: [time, sequence]
    text:
      ja: "あなたは、出来事に前と後があると認識しますか。"
      en: "Do you distinguish before from after?"
  - id: Q08
    priority: 8
    themes: [causality]
    text:
      ja: "あなたは、ある出来事が別の出来事を引き起こすと認識しますか。"
      en: "Do you recognize that one event can cause another?"
  - id: Q09
    priority: 9
    themes: [other_intelligence, prior_contact]
    text:
      ja: "あなたは以前に、自分とは異なる知的存在と接触したことがありますか。"
      en: "Have you previously encountered an intelligence unlike yourselves?"
  - id: Q10
    priority: 10
    themes: [blind_spots, meta_question]
    text:
      ja: "私たちが今、あなたに尋ねるべき、もっと重要な質問がありますか。"
      en: "Is there a more important question we should ask you now?"
